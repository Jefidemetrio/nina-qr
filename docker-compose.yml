version: '3.8'
services:
  whatsapp-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./scripts/whatsapp-bridge:/app/scripts/whatsapp-bridge
      - nina-whatsapp-session:/data/session
      - nina-cache-images:/opt/data/profiles/nina/cache/images
      - nina-cache-documents:/opt/data/profiles/nina/cache/documents
      - nina-cache-audio:/opt/data/profiles/nina/cache/audio
    environment:
      - WHATSAPP_MODE=bot
      - HERMES_IMAGE_CACHE_DIR=/opt/data/profiles/nina/cache/images
      - HERMES_DOCUMENT_CACHE_DIR=/opt/data/profiles/nina/cache/documents
      - HERMES_AUDIO_CACHE_DIR=/opt/data/profiles/nina/cache/audio
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nina-qr:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BRIDGE_URL=http://whatsapp-bridge:3001/qr
    depends_on:
      whatsapp-bridge:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  nina-whatsapp-session:
  nina-cache-images:
  nina-cache-documents:
  nina-cache-audio:
