version: '3.8'
services:
  whatsapp-bridge:
    image: node:20-alpine
    container_name: nina-whatsapp-bridge
    restart: unless-stopped
    command: >
      sh -c "npm install -g @whiskeysockets/baileys && 
      cd /app && node scripts/whatsapp-bridge/bridge.js --port 3001 --session /data/session --mode bot"
    ports:
      - "3001:3001"
    volumes:
      - ./scripts/whatsapp-bridge:/app/scripts/whatsapp-bridge
      - /opt/data/profiles/nina/whatsapp/session:/data/session
      - /opt/data/profiles/nina/cache/images:/opt/data/profiles/nina/cache/images
      - /opt/data/profiles/nina/cache/documents:/opt/data/profiles/nina/cache/documents
      - /opt/data/profiles/nina/cache/audio:/opt/data/profiles/nina/cache/audio
    environment:
      - WHATSAPP_MODE=bot
      - HERMES_IMAGE_CACHE_DIR=/opt/data/profiles/nina/cache/images
      - HERMES_DOCUMENT_CACHE_DIR=/opt/data/profiles/nina/cache/documents
      - HERMES_AUDIO_CACHE_DIR=/opt/data/profiles/nina/cache/audio
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nina-qr:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BRIDGE_URL=http://whatsapp-bridge:3001/qr
    depends_on:
      whatsapp-bridge:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
